# =============================================================================
# Fichero de respuestas · Instalador Correduría Local
# Uso:  sudo bash install.sh --unattended instalacion.conf
# Reutilizable: tras una instalación interactiva puede exportarse con
#   sudo bash install.sh --solo-config --respuestas instalacion.conf
# =============================================================================

# --- Datos del equipo ---------------------------------------------------------
# Nombre del equipo (hostname) donde se instala la aplicación.
# Identifica el servidor en la red Tailscale y en los certificados.
# Solo minúsculas, números, guiones y puntos. Ej.: correduria-oficina
EQUIPO_NOMBRE=correduria-oficina
# ¿Aplicar el nombre con hostnamectl al sistema? (si=no)
CAMBIAR_HOSTNAME=sí
ZONA_HORARIA=Europe/Madrid

# --- Paquete (en modo desatendido indíquelo con --deb <ruta|URL>) -------------
# DEB_FILE no se pide aquí: use la opción --deb del instalador.

# --- Acceso y red --------------------------------------------------------------
# local | tailscale (recomendado) | caddy | lan
MODO_ACCESO=tailscale
# Puerto local de escucha de la aplicación (nunca exponga HTTP plano)
PUERTO=8080
# URL pública que verá el usuario y saldrá en los correos.
# Vacío = se deriva automáticamente del modo elegido.
URL_PUBLICA=
# Nombre/CN interno del certificado cuando MODO_ACCESO=caddy
DOMINIO_LAN=correduria.local

# --- Almacenamiento ------------------------------------------------------------
DATA_DIR=/var/lib/correduria
# Directorio de backups (.crbk). Zona de preparación: aplique la regla 3-2-1
# copiando los .crbk fuera del equipo (NAS, USB cifrado o cloud cifrado).
BACKUP_DIR=/var/lib/correduria/backups

# --- Canal de actualizaciones firmadas (Ed25519) -------------------------------
# Manifiesto firmado del distribuidor (canal público recomendado):
MANIFEST_URL=https://github.com/pericorl-tech/correduria-release/releases/latest/download/manifest-latest.json
# Clave pública Ed25519 propia (vacío = usar la clave embebida en el paquete):
PUBLIC_KEY_FILE=
# Derecho de actualización firmado para esta instalación (vacío = sin entitlement):
ENTITLEMENT_FILE=

# --- Terceros ------------------------------------------------------------------
# ¿Instalar Tailscale? (se fuerza "sí" si MODO_ACCESO=tailscale)
INSTALAR_TAILSCALE=sí
# La clave de autenticación de Tailscale, si la tiene, se pasa por variable de
# entorno y NO se guarda en este fichero:
#   TS_AUTH_KEY=tskey-auth-xxxx sudo bash install.sh --unattended instalacion.conf
