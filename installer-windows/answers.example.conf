# =============================================================================
# Fichero de respuestas · Instalador Correduría Local · WINDOWS
# Uso:  powershell -ExecutionPolicy Bypass -File .\Setup-Correduria.ps1 -AnswersFile instalacion.conf
# =============================================================================

# --- Datos del equipo ---------------------------------------------------------
# Nombre del equipo (hostname). Identifica el servidor en Tailscale/certificados.
EQUIPO_NOMBRE=CORREDURIA-OFICINA
# Zona horaria en formato Windows: Romance Standard Time (España peninsular),
# Mountain Standard Time (Canarias), GMT Standard Time, etc.
ZONA_HORARIA=Romance Standard Time

# --- Acceso y red --------------------------------------------------------------
# local | tailscale (recomendado) | caddy | lan
MODO_ACCESO=tailscale
PUERTO=8080
# Vacío = se deriva automáticamente del modo elegido.
URL_PUBLICA=
# CN interno del certificado cuando MODO_ACCESO=caddy
DOMINIO_LAN=correduria.local

# --- Almacenamiento ------------------------------------------------------------
DATA_DIR=C:\ProgramData\Correduria
BACKUP_DIR=C:\ProgramData\Correduria\backups

# --- Canal de actualizaciones firmadas (Ed25519) -------------------------------
# OJO: el canal público actual publica artefactos linux/arm64; el canal
# windows/amd64 se publicará en la fase 2. Vacío = dejar sin canal hasta entonces.
MANIFEST_URL=
PUBLIC_KEY_FILE=
ENTITLEMENT_FILE=

# --- Terceros ------------------------------------------------------------------
INSTALAR_TAILSCALE=sí
# La clave de autenticación de Tailscale se pasa por variable de entorno
# (no se guarda en este fichero):
#   $env:TS_AUTH_KEY='tskey-auth-xxxx'; .\Setup-Correduria.ps1 -AnswersFile instalacion.conf
