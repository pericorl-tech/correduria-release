# Build del artefacto Windows x64 (win64) de Correduría Local
# -----------------------------------------------------------------------------
# ⚠️ ESTE FICHERO ES LA COPIA DE REFERENCIA. Debe colocarse en el repositorio
#    PRIVADO `correduria` en la ruta:  .github/workflows/build-windows.yml
#    (GitHub impide hacer push de workflows con tokens sin scope "workflow":
#     péguelo desde la interfaz web Actions → New workflow, o use un token con
#     el scope, o pida al mantenedor que lo suba).
# -----------------------------------------------------------------------------
# PyInstaller NO compila en cruzado: el binario de Windows DEBE compilarse en
# Windows. Este workflow usa el runner oficial windows-latest de GitHub para
# producir `correduria-local_<versión>_win32-x64.zip`, el artefacto que consume
# el instalador `installer-windows/Setup-Correduria.ps1`.
#
# Cómo se usa:
#   1. Actions → "Build Windows x64 (win64)" → Run workflow (workflow_dispatch).
#   2. Al terminar, el zip queda como ARTEFACTO de la ejecución
#      (`correduria-local_<versión>_win32-x64`), descargable desde la página
#      de la ejecución.
#   3. Para distribuirlo a clientes, súbelo a los Releases de
#      `correduria-release` junto a su manifest (fase 2: manifest con
#      platform=windows firmado Ed25519 + update-install interno).
#
# El job verifica que el bundle NO contiene fuentes .py (misma política que el
# build del .deb) y que el ejecutable existe.
name: Build Windows x64 (win64)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Leer versión
        id: ver
        shell: python
        run: |
          import os, re, pathlib
          text = pathlib.Path("correduria/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not m:
              raise SystemExit("No se encontró __version__ en correduria/__init__.py")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("version=" + m.group(1) + "\n")

      - name: Build PyInstaller (onedir)
        run: python scripts/build_binary.py

      - name: Comprobar bundle (ejecutable presente, sin fuentes .py)
        shell: pwsh
        run: |
          $exe = "dist/binary/correduria-server/correduria-server.exe"
          if (-not (Test-Path $exe)) { throw "Falta el ejecutable $exe" }
          $py = @(Get-ChildItem -Path "dist/binary/correduria-server" -Recurse -Filter *.py)
          if ($py.Count -gt 0) { throw "El bundle contiene fuentes .py: $($py[0].FullName)" }

      - name: Empaquetar zip (raíz = correduria-server.exe + _internal)
        shell: pwsh
        run: |
          $zip = "correduria-local_${{ steps.ver.outputs.version }}_win32-x64.zip"
          Compress-Archive -Path "dist/binary/correduria-server/*" -DestinationPath $zip
          Get-Item $zip | Format-List Name, Length

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: correduria-local_${{ steps.ver.outputs.version }}_win32-x64
          path: correduria-local_${{ steps.ver.outputs.version }}_win32-x64.zip
          if-no-files-found: error
